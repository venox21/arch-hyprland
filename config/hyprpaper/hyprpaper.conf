# ╔══════════════════════════════════════════════════════════════╗
# ║  Hyprpaper – Hintergrundbilder                               ║
# ╚══════════════════════════════════════════════════════════════╝

# Vorlade-Liste (nur die tatsächlich verwendeten Wallpaper vorladen)
preload = ~/.config/hypr/wallpapers/current.jpg

# Standard-Wallpaper für alle Monitore
wallpaper = , ~/.config/hypr/wallpapers/current.jpg

# Für individuelle Monitore:
# wallpaper = DP-1, ~/.config/hypr/wallpapers/monitor1.jpg
# wallpaper = HDMI-A-1, ~/.config/hypr/wallpapers/monitor2.jpg

# Splash deaktivieren
splash = false

# IPC für dynamischen Wallpaper-Wechsel
ipc = on
