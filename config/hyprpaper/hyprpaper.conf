# ╔══════════════════════════════════════════════════════════════╗
# ║  Hyprpaper – Hintergrundbilder                               ║
# ╚══════════════════════════════════════════════════════════════╝

# Vorlade-Liste (nur die tatsächlich verwendeten Wallpaper vorladen)
preload = ~/.config/hypr/wallpapers/current.jpg

# Standard-Wallpaper für alle Monitore (einschließlich eDP-1 für Laptops)
wallpaper = , ~/.config/hypr/wallpapers/current.jpg
wallpaper = eDP-1, ~/.config/hypr/wallpapers/current.jpg
wallpaper = DP-1, ~/.config/hypr/wallpapers/current.jpg
wallpaper = HDMI-A-1, ~/.config/hypr/wallpapers/current.jpg
wallpaper = Virtual-1, ~/.config/hypr/wallpapers/current.jpg

# Splash deaktivieren
splash = false

# IPC für dynamischen Wallpaper-Wechsel
ipc = on
