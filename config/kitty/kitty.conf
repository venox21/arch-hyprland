# ╔══════════════════════════════════════════════════════════════╗
# ║  Kitty – Tokyo Night Terminal                                ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Schriftart ────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Cursor ────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

# ── Scrollen ──────────────────────────────────────────────────
scrollback_lines    10000
wheel_scroll_min_lines 1

# ── Maus ──────────────────────────────────────────────────────
mouse_hide_wait     3.0
url_style           curly
open_url_with       default
copy_on_select      no
strip_trailing_spaces smart

# ── Fenster ───────────────────────────────────────────────────
window_padding_width    8 12
confirm_os_window_close 0
background_opacity      0.92
dynamic_background_opacity yes

# ── Tab-Leiste ────────────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    2
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Bell ──────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Tokyo Night Farbschema ────────────────────────────────────
# Vordergrund / Hintergrund
foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #33467c

# Cursor
cursor #c0caf5
cursor_text_color #1a1b26

# URL-Farbe
url_color #73daca

# Tab-Leiste
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #292e42

# Normale Farben
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

# Helle Farben
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Erweiterte Farben
mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #bb9af7
mark3_foreground #1a1b26
mark3_background #9ece6a

# ── Wayland ───────────────────────────────────────────────────
linux_display_server wayland

# ── Shell-Integration ─────────────────────────────────────────
shell_integration enabled
