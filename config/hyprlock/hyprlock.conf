# ╔══════════════════════════════════════════════════════════════╗
# ║  Hyprlock – Sperrbildschirm (Tokyo Night)                    ║
# ╚══════════════════════════════════════════════════════════════╝

general {
    disable_loading_bar = false
    grace = 3
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
}

# ── Hintergrund ───────────────────────────────────────────────
background {
    monitor =
    path = ~/.config/hypr/wallpapers/current.jpg
    color = rgba(1a1b26ff)

    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ── Uhrzeit ───────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +%H:%M)</span>"
    color = rgba(c0caf5ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(1a1b2688)

    position = 0, 180
    halign = center
    valign = center
}

# ── Datum ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "<span>$(date '+%A, %d. %B %Y')</span>"
    color = rgba(a9b1d6ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(1a1b2688)

    position = 0, 100
    halign = center
    valign = center
}

# ── Begrüßung ────────────────────────────────────────────────
label {
    monitor =
    text = Willkommen zurück
    color = rgba(7aa2f7ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, -40
    halign = center
    valign = center
}

# ── Benutzername ──────────────────────────────────────────────
label {
    monitor =
    text = $USER
    color = rgba(bb9af7ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, -70
    halign = center
    valign = center
}

# ── Passwort-Eingabe ─────────────────────────────────────────
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(7aa2f7ee)
    inner_color = rgba(24283bcc)
    font_color = rgba(c0caf5ff)
    fade_on_empty = true
    fade_timeout = 2000

    placeholder_text = <i>  Passwort eingeben...</i>
    hide_input = false
    rounding = 10

    check_color = rgba(9ece6aee)
    fail_color = rgba(f7768eee)
    fail_text = <i> Falsches Passwort</i>
    fail_transition = 300

    capslock_color = rgba(e0af68ee)
    numlock_color = rgba(33467cee)
    bothlock_color = rgba(ff9e64ee)

    position = 0, -140
    halign = center
    valign = center
}
