# ╔══════════════════════════════════════════════════════════════╗
# ║  Hyprlock – Sperrbildschirm (Tokyo Night)                    ║
# ╚══════════════════════════════════════════════════════════════╝

general {
    disable_loading_bar = false
    grace = 2
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
}

# ── Hintergrund mit Unschärfe ─────────────────────────────────
background {
    monitor =
    path = ~/.config/hypr/wallpapers/current.jpg
    color = rgba(26, 27, 38, 1.0)

    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.89
    brightness = 0.65
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

# ── Uhrzeit ───────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(192, 202, 245, 0.95)
    font_size = 84
    font_family = JetBrainsMono Nerd Font Light
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(26, 27, 38, 0.6)

    position = 0, 160
    halign = center
    valign = center
}

# ── Datum ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d. %B %Y')"
    color = rgba(125, 207, 255, 0.90)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(26, 27, 38, 0.5)

    position = 0, 95
    halign = center
    valign = center
}

# ── Benutzer-Badge ───────────────────────────────────────────
label {
    monitor =
    text =   $USER
    color = rgba(187, 154, 247, 0.95)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, -45
    halign = center
    valign = center
}

# ── Passwort-Eingabekapsel (Modern Capsule) ──────────────────
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2

    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(122, 162, 247, 0.75)
    inner_color = rgba(36, 40, 59, 0.70)
    font_color = rgba(192, 202, 245, 1.0)
    fade_on_empty = false

    placeholder_text = <span foreground="##7982a9"><i>  Passwort eingeben...</i></span>
    hide_input = false
    rounding = 25

    check_color = rgba(158, 206, 106, 0.9)
    fail_color = rgba(247, 118, 142, 0.9)
    fail_text = <i>Falsches Passwort ($ATTEMPTS)</i>
    fail_transition = 250

    capslock_color = rgba(224, 175, 104, 0.9)
    numlock_color = rgba(51, 70, 124, 0.9)
    bothlock_color = rgba(255, 158, 100, 0.9)

    position = 0, -115
    halign = center
    valign = center
}
