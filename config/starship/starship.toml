# ╔══════════════════════════════════════════════════════════════╗
# ║  Starship – Prompt-Konfiguration (Tokyo Night)               ║
# ╚══════════════════════════════════════════════════════════════╝

# Timeout für Befehle
command_timeout = 1000

# ── Prompt-Format ─────────────────────────────────────────────
format = """
[╭─](fg:#3b4261)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$lua\
$cmd_duration\
$line_break\
[╰─](fg:#3b4261)\
$character"""

# ── Zeichen ───────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold fg:#7aa2f7)"
error_symbol = "[❯](bold fg:#f7768e)"
vimcmd_symbol = "[❮](bold fg:#9ece6a)"

# ── Betriebssystem ───────────────────────────────────────────
[os]
disabled = false
format = "[$symbol ]($style)"
style = "fg:#7aa2f7"

[os.symbols]
Arch = "󰣇"
Linux = "🐧"
Windows = ""
Macos = ""

# ── Benutzer ──────────────────────────────────────────────────
[username]
show_always = false
format = "[$user]($style) "
style_user = "fg:#bb9af7"
style_root = "bold fg:#f7768e"

# ── Hostname ──────────────────────────────────────────────────
[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "fg:#9ece6a"

# ── Verzeichnis ───────────────────────────────────────────────
[directory]
format = "[  $path]($style)[$read_only]($read_only_style) "
style = "fg:#7aa2f7"
read_only = " 󰌾"
read_only_style = "fg:#f7768e"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Videos" = " "
"Desktop" = " "
".config" = " "

# ── Git ───────────────────────────────────────────────────────
[git_branch]
format = "[ $branch]($style) "
style = "fg:#9ece6a"
symbol = ""

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "fg:#e0af68"
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ── Sprachen ──────────────────────────────────────────────────
[python]
format = "[ $version]($style) "
style = "fg:#e0af68"
symbol = ""

[rust]
format = "[ $version]($style) "
style = "fg:#f7768e"
symbol = ""

[golang]
format = "[ $version]($style) "
style = "fg:#7dcfff"
symbol = ""

[nodejs]
format = "[ $version]($style) "
style = "fg:#9ece6a"
symbol = ""

[lua]
format = "[ $version]($style) "
style = "fg:#7aa2f7"
symbol = ""

# ── Befehlsdauer ──────────────────────────────────────────────
[cmd_duration]
format = "[ $duration]($style) "
style = "fg:#ff9e64"
min_time = 2000
show_milliseconds = false

# ── Deaktivierte Module ───────────────────────────────────────
[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true
